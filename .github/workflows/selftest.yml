name: selftest

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 304 self-tests
        run: bash scripts/selftest.sh
      - name: Smoke test CLI
        run: |
          export MEMTREE_DB="$RUNNER_TEMP/mt.db"
          python scripts/memtree.py init
          python scripts/memtree.py commit "喜欢美式" --type fact --subject user.coffee --outcome 0.5
          python scripts/memtree.py commit "改喝拿铁" --type fact --subject user.coffee --outcome 0.5
          python scripts/memtree.py context | grep "拿铁"
          python scripts/memtree.py log --brief | grep "拿铁"
